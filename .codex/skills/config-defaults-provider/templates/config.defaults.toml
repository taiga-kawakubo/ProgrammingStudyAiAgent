template_version = "0.2"

[[settings]]
key = "mentor_start_advice_mode"
required = true
type = "string"
default = "daily_first_question"
allowed_values = ["manual", "daily_first_question"]
description = "mentor表示を学習開始だけで出すか、日付変更後の初回学習質問でも出すか"

[[settings]]
key = "agent_trace_mode"
required = true
type = "string"
default = "brief"
allowed_values = ["hidden", "brief", "detailed"]
description = "回答時にmain Agentとsub Agentの処理経路を表示する粒度"

[[settings]]
key = "scope_listing_max_depth"
required = true
type = "integer"
default = 2
min = 0
max = 5
description = "明示されたディレクトリについて、一覧確認してよい最大階層"
